<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Manyatta Kenya | Luxury Living & Safaris</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                black: '#000000',
                accent: '#DD5536',
                light: '#FFFFFF',
                charcoal: '#1F2937',
                gray: '#F3F4F6',
              }
            },
            fontFamily: {
              serif: ['Playfair Display', 'serif'],
              sans: ['Lato', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      /* Smooth scroll behavior */
      html {
        scroll-behavior: smooth;
      }
      /* Hide scrollbar for clean UI but allow functionality */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
    <script>
      // Global Error Handler to catch startup issues
      window.addEventListener('error', function(event) {
        console.error("Global Error Caught:", event.error);
        const root = document.getElementById('root');
        // If the app hasn't mounted yet, show the error
        if (root && root.innerHTML.trim() === '') {
          const errorDiv = document.createElement('div');
          errorDiv.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; padding: 2rem; color: red; font-family: monospace; overflow: auto;';
          errorDiv.innerHTML = `
            <h1 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem;">Application Error</h1>
            <p style="margin-bottom: 1rem;">The application failed to start.</p>
            <pre style="background: #fef2f2; padding: 1rem; border-radius: 0.5rem; border: 1px solid #fee2e2; overflow-x: auto;">${event.error?.message || event.message}</pre>
            <p style="margin-top: 1rem; color: #666;">Check the console for more details.</p>
          `;
          document.body.appendChild(errorDiv);
        }
      });
    </script>
  <script type="importmap">

    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>
</head>
